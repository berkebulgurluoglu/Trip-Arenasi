<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B1B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Arenası">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Trip Arenası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F7E1D7; --panel:#FFF6EF; --ink:#2B1B2E; --muted:#7A6470; --line:#E6CFC4;
  --trip:#7B5CFF; --insult:#E23B3B; --love:#FF4F93; --go:#1FA866;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#221526; --panel:#2F1E34; --ink:#FFEFE6; --muted:#C7AFBF; --line:#4A3350; }
}
:root[data-theme="dark"]{ --page:#221526; --panel:#2F1E34; --ink:#FFEFE6; --muted:#C7AFBF; --line:#4A3350; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1000px;margin:0 auto;padding:14px 12px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;line-height:1;letter-spacing:-.01em}
.tabs{display:flex;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.tabs button{font:inherit;font-weight:700;font-size:1rem;border:0;background:transparent;color:var(--muted);padding:5px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--love);outline-offset:2px}

.stage{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;border:4px solid #2B1B2E;background:#FFD6A0;isolation:isolate;user-select:none;-webkit-user-select:none}
.scene{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s ease}
.scene.off{opacity:0}

.hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;padding:10px 12px;z-index:6;pointer-events:none}
.hp{display:flex;flex-direction:column;gap:3px;min-width:0}
.hp.right{align-items:flex-end}
.hp-top{display:flex;align-items:baseline;gap:8px;color:#fff;text-shadow:0 2px 0 #2B1B2E,0 0 6px rgba(43,27,46,.6);font-weight:800;font-size:clamp(.85rem,2.2vw,1.1rem);line-height:1}
.hp.right .hp-top{flex-direction:row-reverse}
.hp-num{font-weight:700;font-size:.85em;font-variant-numeric:tabular-nums}
.bar{position:relative;width:100%;height:clamp(12px,2.4vw,20px);background:#5A2A33;border:3px solid #2B1B2E;border-radius:8px;overflow:hidden}
.bar.en{height:clamp(8px,1.4vw,12px);background:#25324A;width:78%;border-width:2px;border-radius:6px}
.bar .trail,.bar .fill{position:absolute;top:0;bottom:0;left:0;width:100%}
.hp.right .bar .trail,.hp.right .bar .fill{left:auto;right:0}
.bar .trail{background:#FFE9A8}
.bar.life .fill{background:#3DDC84;transition:background-color .3s}
.hp[data-level="mid"] .bar.life .fill{background:#FFC93C}
.hp[data-level="lo"] .bar.life .fill{background:#FF4D4D}
.bar.en .fill{background:#4FB3FF}
.bar.en.tired .fill{background:#8FA3B8}
.bar.en.flash{animation:enflash .45s}
@keyframes enflash{25%,75%{border-color:#FF4D4D;transform:translateX(3px)}50%{transform:translateX(-3px)}}
.score{color:#fff;font-weight:800;font-size:clamp(1rem,2.6vw,1.5rem);text-shadow:0 2px 0 #2B1B2E,2px 0 0 #2B1B2E,-2px 0 0 #2B1B2E,0 -2px 0 #2B1B2E;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}

.fighter{position:absolute;left:0;bottom:6%;width:17%;transform-origin:50% 100%;z-index:3;--fd:1}
.fighter.face-left{--fd:-1}
.fighter.ghost{opacity:.35}
.body,.lean,.bob{transform-origin:50% 100%}
.body{transition:transform .09s}
.fighter.crouch .body{transform:scaleY(.68) scaleX(1.06)}
.lean{transition:transform .1s}
.fighter.kick .lean{transform:rotate(calc(-8deg * var(--fd)))}
.fighter.slap .lean{transform:rotate(calc(5deg * var(--fd)))}
.bob{animation:breathe 2.4s ease-in-out infinite}
.fighter.walk .bob{animation:walk .32s ease-in-out infinite}
.fighter.air .bob,.fighter.custom .bob{animation:none}
@keyframes breathe{50%{transform:scaleY(.975)}}
@keyframes walk{50%{transform:translateY(-4%)}}
.csvg{display:block;width:100%;height:auto}
.fighter.face-left .csvg{transform:scaleX(-1)}
.fighter.hitflash .csvg{filter:brightness(1.8) saturate(.3)}
.arm-f{transform-box:view-box;transform-origin:92px 108px;transition:transform .07s}
.fighter.slap .arm-f{transform:rotate(-100deg)}
.fighter.love .arm-f{transform:rotate(-150deg)}
.leg-f{transform-box:view-box;transform-origin:79px 140px;transition:transform .08s}
.fighter.kick .leg-f{transform:rotate(-82deg)}
.sweat{position:absolute;top:12%;left:16%;width:8%;aspect-ratio:2/3;background:#7EC8F0;border:2px solid #2B1B2E;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;display:none}
.fighter.face-left .sweat{left:auto;right:16%}
.fighter.tired .sweat{display:block;animation:drip .9s ease-in infinite}
@keyframes drip{from{transform:translateY(-30%);opacity:1}to{transform:translateY(60%);opacity:0}}

.c-skin{fill:var(--skin)} .c-hair{fill:var(--hair)} .c-top{fill:var(--top)} .c-bottom{fill:var(--bottom)} .c-shoe{fill:var(--shoes)}
.c-leg{fill:var(--bottom)}
.o{stroke:#2B1B2E;stroke-width:2.6;stroke-linejoin:round}
.fighter[data-skirt="1"] .c-leg{fill:var(--skin)}
.skirt,.acc-glasses,.acc-beard{display:none}
.fighter[data-skirt="1"] .skirt{display:inline} .fighter[data-skirt="1"] .pantstop{display:none}
.fighter[data-glasses="1"] .acc-glasses{display:inline}
.fighter[data-beard="1"] .acc-beard{display:inline}
.f{display:none}
.fighter[data-face="normal"] .f-normal,.fighter[data-face="angry"] .f-angry,.fighter[data-face="hurt"] .f-hurt,.fighter[data-face="love"] .f-love,.fighter[data-face="tired"] .f-tired{display:inline}

.bubble{position:absolute;bottom:102%;left:50%;transform:translateX(-50%);background:#fff;color:#2B1B2E;border:3px solid #2B1B2E;border-radius:14px;padding:2px 10px;font-weight:800;font-size:clamp(.75rem,2vw,1rem);white-space:nowrap;animation:pop .2s ease-out;z-index:7}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#2B1B2E}
.bubble.sulk{background:#EDE7FF} .bubble.insult{background:#FFE1E1;color:#B31D1D} .bubble.love{background:#FFE3EF;color:#C2185B} .bubble.bot{background:#E3FAF8;color:#16615B}
@keyframes pop{from{transform:translateX(-50%) scale(.5);opacity:0}}
.dmg,.pow{position:absolute;left:50%;pointer-events:none;z-index:8;font-weight:800;-webkit-text-stroke:2px #2B1B2E;paint-order:stroke fill;white-space:nowrap}
.dmg{top:4%;font-size:clamp(1.1rem,3.4vw,2rem);color:#FF3B3B;animation:rise 1s ease-out forwards}
.dmg.pink{color:#FF6FB0}
.pow{top:30%;font-size:clamp(1.2rem,4vw,2.4rem);color:#FFE14D;animation:powa .55s ease-out forwards}
.pow.miss{color:#BFE6FF}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
@keyframes powa{0%{opacity:0;transform:translate(-50%,0) scale(.3) rotate(-12deg)}30%{opacity:1;transform:translate(-50%,0) scale(1.25) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-10px) scale(1) rotate(-6deg)}}

.fx{position:absolute;left:0;top:0;pointer-events:none;z-index:9}
.fheart{width:clamp(16px,2.6vw,28px)}
.fheart svg,.prop svg{display:block;width:100%;height:auto}
.smoke{border-radius:50%;background:rgba(220,220,230,.75);border:2px solid rgba(43,27,46,.25)}
.prop{position:absolute;left:0;top:0;z-index:4;display:none}
.prop.on{display:block}
#rocket{width:7.5%}
#robot{width:9%;z-index:5}
#robot .bubble{bottom:104%}
.flame{display:none}
#rocket.lit .flame{display:inline;animation:flick .08s steps(2) infinite}
@keyframes flick{50%{transform:scaleY(1.25)}}
.flame{transform-box:view-box;transform-origin:30px 124px}
#robot.walking svg{animation:walk .3s ease-in-out infinite}
#robot.wave .r-arm{transform-box:view-box;transform-origin:62px 62px;animation:wave .4s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-110deg)}}
.rope{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.star{width:5%}
.fighter.rage .csvg{filter:drop-shadow(0 0 5px #FF2E2E) drop-shadow(0 0 2px #FF2E2E)}
.fighter.rage.hitflash .csvg{filter:brightness(1.8) saturate(.3)}
.chain{position:absolute;left:50%;top:56%;transform:translateX(-50%);font-weight:800;font-size:clamp(.9rem,2.4vw,1.3rem);color:#fff;-webkit-text-stroke:2px #2B1B2E;paint-order:stroke fill;white-space:nowrap;pointer-events:none;z-index:8;animation:rise .9s ease-out forwards}
.pow.rage{color:#FF5A5A}
.pow.good{color:#9DFFB0}
.combo{position:absolute;left:50%;top:44%;transform:translate(-50%,0) scale(.6) rotate(-4deg);opacity:0;z-index:10;text-align:center;color:#FFE14D;font-weight:800;font-size:clamp(1.2rem,4.6vw,2.6rem);line-height:1.05;-webkit-text-stroke:3px #2B1B2E;paint-order:stroke fill;width:92%;pointer-events:none}
.combo small{display:block;font-size:.5em;color:#fff;-webkit-text-stroke:2px #2B1B2E}
.combo.show{animation:combo 1.4s ease-out forwards}
@keyframes combo{0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,0) scale(1.15) rotate(-4deg)}75%{opacity:1;transform:translate(-50%,0) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-14px) scale(1) rotate(-4deg)}}
.item{width:5.5%;z-index:4}
.item svg{display:block;width:100%;height:auto}
.item.gone{transition:opacity .3s,transform .3s;opacity:0}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
.modes button{font:inherit;font-weight:700;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 14px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.modes button:disabled{opacity:.5;cursor:not-allowed}
.mode-desc{margin:0 0 12px;color:var(--muted);font-weight:600;font-size:.95rem}
.guide h2{margin:0 0 8px;font-size:1.15rem}
.guide h3{margin:12px 0 6px;font-size:1rem}
.combo-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.combo-list li{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{display:inline-block;font-weight:800;font-size:.85rem;color:#fff;border:2px solid #2B1B2E;border-radius:999px;padding:0 10px;line-height:1.6}
.chip.trip{background:var(--trip)} .chip.insult{background:var(--insult)}
.combo-name{font-weight:800;margin-left:4px}
.combo-bonus{color:var(--go);font-weight:800}
.guide p{margin:4px 0;line-height:1.45;max-width:72ch}
.team{display:flex;flex-direction:column;gap:6px;min-width:0}
.hud.duo .bar.life{height:clamp(9px,1.8vw,14px)}
.hud.duo .bar.en{height:clamp(5px,1vw,8px)}
.hud.duo .hp-top{font-size:clamp(.7rem,1.8vw,.95rem)}
.hp[hidden],.team-h[hidden],.slot[hidden],fieldset[hidden]{display:none}
.hp.ko .nm{text-decoration:line-through}
.hp.ko{opacity:.7}
.stage.duo .fighter{width:15%}
.fighter.off{display:none}
.fighter.ko .bob{animation:none}
.team-col{display:flex;flex-direction:column;gap:10px}
.team-h{margin:0;font-size:1rem;color:var(--muted)}
#fmts{margin-bottom:8px}
.hdr-right{display:flex;align-items:center;gap:8px}
.sound{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}

.banner,.count{position:absolute;left:50%;transform:translate(-50%,-10px) scale(.9);opacity:0;z-index:10;text-align:center;color:#fff;font-weight:800;line-height:1.1;text-shadow:0 3px 0 #2B1B2E,2px 0 0 #2B1B2E,-2px 0 0 #2B1B2E,0 -2px 0 #2B1B2E,0 0 16px rgba(43,27,46,.5);width:92%;transition:opacity .3s,transform .3s;pointer-events:none}
.banner{top:24%;font-size:clamp(1.1rem,4vw,2.3rem)}
.banner small{display:block;font-size:.65em;margin-top:.25em}
.count{top:30%;font-size:clamp(2.5rem,10vw,6rem)}
.banner.show,.count.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* Lobby & pad */
.panel{margin-top:12px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px}
.conn{margin:0 0 10px;font-weight:700;color:var(--muted)}
.conn b{color:var(--ink)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.slot.mine{border-color:var(--love)}
.slot-name{font-weight:800;font-size:1.15rem;line-height:1.1}
.slot-state{color:var(--muted);font-weight:600;min-height:1.4em}
.slot-state.ok{color:var(--go)}
.pick{font:inherit;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:3px 12px;cursor:pointer}
.pick[hidden]{display:none}
.lobby-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:12px}
.link{font:inherit;font-weight:700;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.hint{margin:10px 0 0;color:var(--muted);font-size:.95rem;line-height:1.45;max-width:70ch}
.btn{font:inherit;font-weight:800;font-size:clamp(.95rem,2.4vw,1.15rem);color:#fff;border:3px solid #2B1B2E;border-radius:14px;padding:8px 16px;min-height:52px;cursor:pointer;box-shadow:0 5px 0 #2B1B2E;transition:transform .06s,box-shadow .06s,opacity .2s;line-height:1.05;touch-action:none}
.btn small{display:block;font-weight:600;font-size:.72em;opacity:.9}
.btn:active:not(:disabled),.btn.held{transform:translateY(4px);box-shadow:0 1px 0 #2B1B2E}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dim{opacity:.5}
.btn.ready{background:var(--go)} .btn.ready.on{background:#7A6470}
.btn.trip{background:var(--trip)} .btn.insult{background:var(--insult)} .btn.love{background:var(--love)}
.pad{display:flex;justify-content:space-between;gap:12px;align-items:center}
.pad[hidden]{display:none}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px}
.dpad .btn{background:#4A3B5C;padding:0;min-height:0;font-size:1.3rem}
.dpad [data-k="up"]{grid-column:2;grid-row:1}
.dpad [data-k="left"]{grid-column:1;grid-row:2}
.dpad [data-k="down"]{grid-column:2;grid-row:2}
.dpad [data-k="right"]{grid-column:3;grid-row:2}
.atk{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.atk .btn[hidden]{display:none}
.keys{margin:8px 0 0;color:var(--muted);font-size:.9rem;line-height:1.4}

details.edit{margin-top:14px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 16px}
details.edit summary{cursor:pointer;font-weight:800;font-size:1.05rem}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:800;margin-bottom:6px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.field label{font-weight:600}
.field input[type=text]{font:inherit;width:9.5em;max-width:60%;padding:2px 8px;border:2px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink)}
.field input[type=color]{width:44px;height:30px;border:2px solid var(--line);border-radius:8px;padding:0;background:none;cursor:pointer}
.field input[type=checkbox]{width:22px;height:22px;accent-color:var(--love)}

@media (max-width:640px){
  .stage{aspect-ratio:4/3}
  .fighter{width:19%}
  .slots,.edit-grid{grid-template-columns:1fr}
  .dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px}
  .atk{flex-direction:column;align-items:stretch}
  .atk .btn{min-height:46px;padding:6px 12px}
  .pad{align-items:flex-end}
}
@media (prefers-reduced-motion: reduce){
  .bob,.fighter.walk .bob{animation:none}
}

.title-card{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:6;text-align:center;pointer-events:none;width:90%}
.title-card h2{margin:0;font-size:clamp(2rem,8vw,4.6rem);font-weight:800;line-height:.95;color:#FFE14D;-webkit-text-stroke:3px #2B1B2E;paint-order:stroke fill;letter-spacing:-.02em;transform:rotate(-3deg)}
.title-card p{margin:.4em 0 0;color:#fff;font-weight:800;font-size:clamp(.9rem,2.6vw,1.3rem);text-shadow:0 2px 0 #2B1B2E,2px 0 0 #2B1B2E,-2px 0 0 #2B1B2E,0 -2px 0 #2B1B2E}
.title-card[hidden],.hud[hidden],#pips[hidden]{display:none}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px}
#pips{display:flex;gap:10px}
#pips span{display:flex;gap:4px}
.pip{display:block;width:clamp(9px,1.6vw,13px);height:clamp(9px,1.6vw,13px);border-radius:50%;border:2px solid #2B1B2E;background:rgba(255,255,255,.35)}
.pip.on{background:#FFE14D}
.panel h2{margin:0 0 4px;font-size:1.3rem}
.room-list{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.room.waiting{border-color:var(--go)}
.room.busy{opacity:.7}
.room-name{font-weight:800;font-size:1.05rem;line-height:1.15}
.room-state{color:var(--muted);font-weight:600;font-size:.95rem}
.room.waiting .room-state{color:var(--go)}
.btn.join{background:var(--trip);min-height:44px;padding:6px 16px}
.menu-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px}
.btn.local{background:#4A3B5C}
.muted{color:var(--muted)} .small{font-size:.88rem}
.room-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.room-head h2{margin:0}
.opt-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:4px}
.sbtn{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
dialog#settings{width:min(680px,94vw);max-height:88vh;overflow:auto;border:3px solid var(--ink);border-radius:20px;background:var(--panel);color:var(--ink);padding:16px 18px}
dialog#settings::backdrop{background:rgba(43,27,46,.55)}
.set-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.set-head h2{margin:0}
dialog section{margin-top:12px}
dialog h3{margin:0 0 6px;font-size:1.05rem}
dialog h4{margin:6px 0 4px;font-size:.95rem}
.edit-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field.line input[type=text]{width:auto;flex:1;max-width:none}
.field.line label{min-width:1.6em}
.cnt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
@media (max-width:640px){ .room-list,.edit-cols{grid-template-columns:1fr} }

.shield{position:absolute;left:-12%;right:-12%;top:-4%;bottom:0;border-radius:50% 50% 42% 42%;border:3px solid #FF6FB0;background:radial-gradient(circle at 50% 40%,rgba(255,180,215,.15),rgba(255,111,176,.35));box-shadow:0 0 14px rgba(255,111,176,.7);display:none;pointer-events:none;z-index:2}
.fighter.shielded .shield{display:block;animation:shieldp .35s ease-in-out infinite alternate}
@keyframes shieldp{from{transform:scale(.97);opacity:.8}to{transform:scale(1.03);opacity:1}}
.swoosh{width:7%;z-index:7}
.swoosh svg,.spark svg{display:block;width:100%;height:auto}
.spark{width:8%;z-index:8}
.dot{border-radius:50%;background:#FFE14D;border:2px solid #2B1B2E;z-index:8}
.fighter.hitflash .lean{transform:rotate(calc(-10deg * var(--fd)))}
.stage.stop *{animation-play-state:paused !important}

.badge{display:inline-block;min-width:1.4em;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--insult);color:#fff;font-size:.8rem;line-height:1.5;text-align:center}
.badge[hidden],#auth[hidden],.af[hidden],#authForm[hidden],#authTabs[hidden]{display:none}
.auth-form{display:grid;gap:10px;max-width:380px;margin-top:10px}
.af{display:grid;gap:4px;font-weight:700}
.af input,.add-row input{font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--page);color:var(--ink)}
.err{color:var(--insult);font-weight:700;margin:0;min-height:1.2em}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.row-act{display:flex;gap:6px;align-items:center}
.fr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot-on{display:inline-block;width:10px;height:10px;border-radius:50%;background:#B9A8B3}
.dot-on.on{background:var(--go)}
.sbtn.go{background:var(--go);color:#fff;border-color:var(--go)}
.sbtn:disabled{opacity:.5;cursor:not-allowed}
dialog#friendsDlg{width:min(560px,94vw);max-height:88vh;overflow:auto;border:3px solid var(--ink);border-radius:20px;background:var(--panel);color:var(--ink);padding:16px 18px}
dialog#friendsDlg::backdrop{background:rgba(43,27,46,.55)}
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:50;width:min(420px,92vw)}
.toast{background:var(--ink);color:var(--page);border-radius:14px;padding:10px 14px;box-shadow:0 6px 0 rgba(43,27,46,.35);font-weight:700;animation:pop2 .2s ease-out}
.toast-actions{display:flex;gap:8px;margin-top:8px}
@keyframes pop2{from{transform:translateY(10px);opacity:0}}

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Hesapsız çok oyunculu bağlantı: PeerJS (WebRTC) ile aynı odaya bağlanır.
   Linki açan ilk kişi odayı kurar, ikinci kişi ona bağlanır. ?oda=isim ile ayrı oda açılabilir. */
(function(){
  const params = new URLSearchParams(location.search);
  const code = (params.get('oda') || 'bk7f3a9c-kardelen').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40) || 'bk7f3a9c-kardelen';
  const ROOM = 'trip-arenasi-' + code;
  let room = null;

  function makeRoom(){
    if(typeof Peer === 'undefined') return null;
    const myId = 'p' + Math.random().toString(36).slice(2,12);
    let peer = null, isHost = false, connected = false, snapshot = null, restartTimer = null;
    let myPresence = {}, myUpdated = Date.now();
    const remotes = new Map();
    const conns = new Set();
    const connHandlers = new Set();

    function setConnected(v){
      if(v === connected) return;
      connected = v;
      connHandlers.forEach(h=>{ try{ h(v); }catch(e){} });
    }
    const dirty = () => { snapshot = null; };
    function send(c, msg){ try{ if(c.open) c.send(msg); }catch(e){} }
    function broadcast(msg, except){ conns.forEach(c=>{ if(c !== except) send(c, msg); }); }
    function handleData(c, d){
      if(!d || typeof d !== 'object') return;
      if(d.t === 'p' && typeof d.id === 'string' && d.id !== myId && d.p && typeof d.p === 'object'){
        const prev = remotes.get(d.id);
        remotes.set(d.id, {presence: d.p, conn: c, lastSeen: Date.now(), updatedAt: Date.now()});
        if(!prev || JSON.stringify(prev.presence) !== JSON.stringify(d.p)) dirty();
        if(isHost) broadcast(d, c);
      } else if(d.t === 'bye' && typeof d.id === 'string'){
        remotes.delete(d.id); dirty();
        if(isHost) broadcast(d, c);
      }
    }
    function wire(c){
      conns.add(c);
      c.on('open', ()=>{
        send(c, {t:'p', id: myId, p: myPresence});
        if(isHost) remotes.forEach((r, id)=>send(c, {t:'p', id, p: r.presence}));
        else setConnected(true);
      });
      c.on('data', d=>handleData(c, d));
      const drop = ()=>{
        if(!conns.has(c)) return;
        conns.delete(c);
        for(const [id, r] of remotes) if(r.conn === c){ remotes.delete(id); if(isHost) broadcast({t:'bye', id}); }
        dirty();
        if(!isHost){ setConnected(false); restart(1200); }
      };
      c.on('close', drop); c.on('error', drop);
    }
    function cleanup(){
      conns.forEach(c=>{ try{ c.close(); }catch(e){} });
      conns.clear(); remotes.clear(); dirty();
      if(peer){ const p = peer; peer = null; try{ p.destroy(); }catch(e){} }
    }
    function restart(ms){ clearTimeout(restartTimer); restartTimer = setTimeout(becomeHost, ms); }
    function becomeHost(){
      cleanup(); setConnected(false); isHost = false;
      const p = new Peer(ROOM, {debug:0});
      peer = p;
      p.on('open', ()=>{ if(peer !== p) return; isHost = true; setConnected(true); });
      p.on('connection', c=>{ if(peer !== p) return; wire(c); });
      p.on('disconnected', ()=>{ if(peer !== p) return; try{ p.reconnect(); }catch(e){ restart(2000); } });
      p.on('error', err=>{
        if(peer !== p) return;
        if(err && err.type === 'unavailable-id') joinAsClient();
        else if(!isHost) restart(3000);
      });
    }
    function joinAsClient(){
      cleanup(); isHost = false;
      const p = new Peer(undefined, {debug:0});
      peer = p;
      p.on('open', ()=>{
        if(peer !== p) return;
        const c = p.connect(ROOM, {reliable:true, serialization:'json'});
        wire(c);
        setTimeout(()=>{ if(peer === p && !c.open) restart(400); }, 9000);
      });
      p.on('error', err=>{
        if(peer !== p) return;
        restart(err && err.type === 'peer-unavailable' ? 700 : 3000);
      });
    }
    setInterval(()=>{
      broadcast({t:'p', id: myId, p: myPresence});
      const now = Date.now();
      for(const [id, r] of remotes) if(now - r.lastSeen > 8000){ remotes.delete(id); dirty(); }
    }, 2000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !connected) restart(100); });
    addEventListener('pagehide', ()=>broadcast({t:'bye', id: myId}));
    becomeHost();

    return Object.freeze({
      presence(patch){
        if(patch && typeof patch === 'object'){
          for(const k in patch){ if(patch[k] === null) delete myPresence[k]; else myPresence[k] = patch[k]; }
          myPresence = Object.assign({}, myPresence); myUpdated = Date.now(); dirty();
          broadcast({t:'p', id: myId, p: myPresence});
        }
        return Promise.resolve();
      },
      peers(){
        if(!snapshot){
          const list = [{peer: myId, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: myPresence, updatedAt: myUpdated}];
          remotes.forEach((r, id)=>list.push({peer: id, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: r.presence, updatedAt: r.updatedAt}));
          snapshot = list;
        }
        return snapshot;
      },
      connected(){ return connected; },
      onConnection(h){ connHandlers.add(h); setTimeout(()=>{ try{ h(connected); }catch(e){} }, 0); return ()=>connHandlers.delete(h); },
      onPeers(){ return ()=>{}; }
    });
  }
  window.claude = { use: async name => { if(name !== 'room') return null; if(!room) room = makeRoom(); return room; } };
})();
</script>

<script>
(function(){
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,k) => a + (b-a)*k;
const ease = k => k<.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
const rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ---------------- Scenes ---------------- */
function minaret(x, top, base, w, fill){
  const b1 = top + (base-top)*0.25, b2 = top + (base-top)*0.55;
  return `<g fill="${fill}"><rect x="${x-w/2}" y="${top}" width="${w}" height="${base-top}"/>
  <path d="M${x-w/2-1} ${top} L${x} ${top-w*3} L${x+w/2+1} ${top} Z"/>
  <rect x="${x-w/2-3}" y="${b1}" width="${w+6}" height="4"/><rect x="${x-w/2-3}" y="${b2}" width="${w+6}" height="4"/></g>`;
}
function palm(x, y, s){
  let fr = '';
  [-160,-130,-100,-70,-35,-5,20].forEach(a=>{
    fr += `<path d="M0 0 C30 -20 62 -12 84 18 C58 2 30 0 0 7 Z" transform="rotate(${a})" fill="#3F7A4A" stroke="#2B5A36" stroke-width="2"/>`;
  });
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M0 200 C4 140 -8 80 8 0" stroke="#7A5236" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M0 200 C4 140 -8 80 8 0" stroke="#9A6C48" stroke-width="13" fill="none" stroke-dasharray="3 9"/>
    <g transform="translate(8 0)">${fr}<circle r="6" fill="#6B4A2E"/></g></g>`;
}
function buildAdana(){
  let m = '';
  m += minaret(292,118,300,9,'#C9785E') + minaret(508,118,300,9,'#C9785E');
  m += minaret(322,140,300,8,'#C9785E') + minaret(478,140,300,8,'#C9785E');
  m += minaret(262,160,300,7,'#D08A6C') + minaret(538,160,300,7,'#D08A6C');
  let arches = '';
  for(let i=-1;i<14;i++){ const x0 = i*64 + 10; arches += `<path d="M${x0} 320 V300 A22 22 0 0 1 ${x0+44} 300 V320 Z" fill="#4F97A8"/>`; }
  let tiles = '';
  for(let i=0;i<17;i++) tiles += `<path d="M${i*52-20} 450 L${i*52+10} 360" stroke="#CF9463" stroke-width="2"/>`;
  return `
  <defs><linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9E5E"/><stop offset=".7" stop-color="#FFD6A0"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#skyA)"/>
  <circle cx="630" cy="110" r="82" fill="#FFF1C1" opacity=".35"/><circle cx="630" cy="110" r="48" fill="#FFF1C1"/>
  <g fill="#C9785E">
    <path d="M330 240 A70 70 0 0 1 470 240 Z"/><rect x="396" y="158" width="8" height="16"/>
    <path d="M300 262 A32 32 0 0 1 364 262 Z M436 262 A32 32 0 0 1 500 262 Z"/>
    <rect x="320" y="238" width="160" height="30"/><rect x="286" y="262" width="228" height="42"/>
  </g>
  ${m}
  <rect y="292" width="800" height="62" fill="#5FA8B8"/>
  <path d="M40 336 h60 M180 344 h90 M360 334 h50 M520 342 h80 M660 336 h70" stroke="#A7DCE4" stroke-width="3" stroke-linecap="round"/>
  <rect x="-10" y="262" width="820" height="9" fill="#D9A274" stroke="#8E5A3A" stroke-width="2"/>
  <rect x="-10" y="270" width="820" height="50" fill="#B97A52"/>
  <path d="M-10 283 H810" stroke="#A56A45" stroke-width="2"/>
  ${arches}
  <rect y="352" width="800" height="100" fill="#E2A874"/><rect y="352" width="800" height="8" fill="#C98B5E"/>
  ${tiles}
  ${palm(58,160,1)}${palm(742,170,.95)}`;
}
function buildHatay(){
  const hs = [96,70,112,84,64,104,78,118,72,92,66,100];
  const stones = ['#D9C3A0','#CDB28C','#E4D2B3'];
  let houses = '';
  hs.forEach((h,i)=>{
    const x = i*68 - 14, w = 64, top = 318 - h, c = stones[i%3];
    houses += `<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="${c}" stroke="#8E7359" stroke-width="2"/><rect x="${x-2}" y="${top-5}" width="${w+4}" height="6" fill="#B89C78"/>`;

function setScene(s, ts){

  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.scene===s));

function ac(){
  if(muted) return null;
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume().catch(()=>{});

}

function tone(freq, dur, type, vol, slide, delay){
  const c = ac(); if(!c) return;
  const t = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, sweep){
  const c = ac(); if(!c) return;
  const t = c.currentTime, len = Math.floor(c.sampleRate*dur);
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t);
  if(sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(c.destination); src.start(t);
}

function sanitizeProfile(r, baseSlot){
  const p = blankProfile();
  if(!r || typeof r !== 'object') return p;
  if(typeof r.name === 'string') p.name = r.name.slice(0,14);
  COLORS.forEach(k=>{ if(isHex(r[k]) && (!baseSlot || r[k].toLowerCase() !== defaults[baseSlot][k].toLowerCase())) p[k] = r[k]; });
  FLAGS.forEach(k=>{ if(typeof r[k] === 'boolean' && (!baseSlot || r[k] !== defaults[baseSlot][k])) p[k] = r[k]; });
  p.tl = cleanLines(r.tl); p.il = cleanLines(r.il);
  if(['Ben','Sevgilim','Erkek 2','Kız 2','Me','My love'].includes(p.name)) p.name = '';
  return p;
}

const isRage = f => f.hp > 0 && f.hp <= maxHp()*0.3;
function applyHit(B, A, type, ax, now){
  const s = SPEC[type];
  if(now - B.lastHitAt > 1100) B.chain = [];
  B.lastHitAt = now; B.chain.push(type);
  let dmg = s.dmg;
  if(isRage(A)) dmg = Math.round(dmg*1.3);
  let combo = -1;
  for(let i=0;i<COMBOS.length;i++){
    const q = COMBOS[i].seq, n = B.chain.length;
    if(n >= q.length && q.every((x,j)=>B.chain[n-q.length+j]===x)){ combo = i; break; }
  }
  const ch = B.chain.length;
  if(combo >= 0){ dmg += COMBOS[combo].bonus; B.cbs++; B.cb = combo; B.cba = A.slot; B.chain = []; showCombo(combo, A.slot); }
  B.ch = combo >= 0 ? 0 : ch;
  B.hp = Math.max(0, B.hp - dmg);
  B.hs++; B.ht = type;
  const dir = Math.sign(B.x - ax) || -teamDir(B.slot);
  B.x = clamp(B.x + dir*s.knock, XMIN, XMAX);
  if(type==='insult' && B.y <= 0 && B.vy === 0) B.vy = 300;

  pushPresence(true);

function tryHit(A, B, now){
  if(!A.atk || A.atk.type==='love' || !alive(B) || !alive(A)) return;
  const s = SPEC[A.atk.type], el = now - A.atk.start;
  if(el < s.act[0] || el > s.act[1]) return;
  if(B.gotHit[A.slot] === A.atk.id || B.dodged[A.slot] === A.atk.id) return;
  const ax = posX(A), dist = Math.abs(ax - B.x);
  if(dist > s.reach) return;
  const dirB = Math.sign(B.x - ax);
  if(dirB && dirB !== A.fd && dist > 60) return;
  if(B.shieldUntil > now){
    B.gotHit[A.slot] = A.atk.id; B.chain = [];
    B.en = Math.min(100, B.en + 15); B.pc++; B.pt = A.slot;
    blockFx(B);
    if(A.local) parried(A, now);
    pushPresence(true);
    return;
  }
  if((A.atk.type==='trip' && B.cr && B.y < 5) || (A.atk.type==='insult' && B.y > 40)){
    B.dodged[A.slot] = A.atk.id;
    textFx(B.el, 'pow miss', t('miss')); sfx.miss();
    return;
  }

function updateLocal(f, inp, dt, now){
  if(!alive(f)){
    f.mv = 0; f.cr = false; f.atk = null;
    if(f.vy !== 0 || f.y > 0){ f.vy -= GRAV*dt; f.y += f.vy*dt; if(f.y <= 0){ f.y = 0; f.vy = 0; } }
    f.dispX = f.x; return;
  }
  if(f.atk && now - f.atk.start >= SPEC[f.atk.type].dur) f.atk = null;
  const attacking = !!f.atk, stunned = now < f.stunUntil, grounded = f.y <= 0;
  f.cr = !!inp.down && grounded && !attacking && !stunned;
  let dir = 0;
  if(!f.cr && !attacking && !stunned) dir = (inp.right?1:0) - (inp.left?1:0);
  f.mv = dir;
  f.x += dir * SPEED * dt;
  if(inp.up && grounded && f.vy===0 && !f.cr && !attacking && !stunned) f.vy = JUMP;
  if(f.vy !== 0 || f.y > 0){ f.vy -= GRAV*dt; f.y += f.vy*dt; if(f.y <= 0){ f.y = 0; f.vy = 0; } }
  f.x = clamp(f.x, XMIN, XMAX);
  for(const e of enemiesOf(f)){
    if(!alive(e)) continue;
    const ex = posX(e);
    if(Math.abs(f.x - ex) < SEP){
      const d = Math.sign(f.x - ex) || -teamDir(f.slot);
      f.x = clamp(ex + d*SEP, XMIN, XMAX);
      if(Math.abs(f.x - ex) < SEP && e.local) e.x = clamp(f.x - d*SEP, XMIN, XMAX);
    }
  }
  const ne = nearestEnemy(f);
  const ox = ne ? posX(ne) : f.x + f.fd*200;
  f.fd = Math.sign(ox - f.x) || f.fd;
  const away = dir !== 0 && Math.sign(dir) !== Math.sign(ox - f.x);
  const rate = (attacking ? 0 : ((away || f.cr) ? 35 : 15)) * MODES[gameMode].regen;
  f.en = Math.min(100, f.en + rate*dt);

}

let roundWins = {L:0, R:0}, reT0 = 0, lastLose = null;
const need = () => rounds===3 ? 2 : 1;
const roundNo = () => roundWins.L + roundWins.R + 1;

function setGameMode(m, ts){
  if(!MODES[m]) return;
  const changed = m !== gameMode;
  gameMode = m; modeTs = ts; store.set('ta2-mode', m);
  if(changed && phase==='lobby') resetFighters();
}
function setRounds(r, ts){ if(r!==1 && r!==3) return; rounds = r; roundsTs = ts; store.set('ta3-rounds', r); }
function setFmt(f, ts){
  if(f!=='1v1' && f!=='2v2') return;
  const changed = f !== fmt;
  fmt = f; fmtTs = ts; store.set('ta2-fmt', f);
  if(changed){
    if(mySide && !ACTIVE().includes(mySide)){ mySide = null; ready = false; SLOTS.forEach(s=>F[s].local = false); }
    if(phase==='lobby') resetFighters();
    requestAnimationFrame(measure);
  }
}
const lobbyEditable = () => phase==='lobby' && screen==='room';
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click', ()=>{
  if(!lobbyEditable()) return;
  setGameMode(b.dataset.mode, Date.now()); ready = false; pushPresence(true);
}));
document.querySelectorAll('#fmts button').forEach(b=>b.addEventListener('click', ()=>{
  if(!lobbyEditable() || mode!=='online') return;
  setFmt(b.dataset.fmt, Date.now()); ready = false; pushPresence(true);
}));
document.querySelectorAll('#roundsSel button').forEach(b=>b.addEventListener('click', ()=>{
  if(!lobbyEditable()) return;
  setRounds(+b.dataset.r, Date.now()); ready = false; pushPresence(true);
}));

function setMode(m){
  mode = m; mySide = null; ready = false; phase = 'lobby'; note = '';
  SLOTS.forEach(s=>F[s].local = (m==='local' && (s==='L' || s==='R')));
  roundWins = {L:0, R:0};
  resetFighters(); pushPresence(true);
  requestAnimationFrame(measure);
}
function joinRoom(id){
  if(!room || !ROOMS.includes(id)) return;
  const info = roomInfo[id];
  if(info && (info.inGame || info.seated >= info.cap)) return;
  myRid = id; screen = 'room'; mySide = null; ready = false; autoDone = false; note = '';
  loadScore();
  modeTs = fmtTs = roundsTs = 0;
  phase = 'lobby'; roundWins = {L:0, R:0};
  store.set('ta3-room', id);
  resetFighters(); pushPresence(true);
}
function leaveRoom(){
  if(phase !== 'lobby') return;
  if(mode==='local') setMode('online');
  myRid = null; screen = 'menu'; mySide = null; ready = false; note = '';
  SLOTS.forEach(s=>F[s].local = false);
  resetFighters(); hideProps(); hideBanner();
  pushPresence(true);
}
$('#roomList').addEventListener('click', e=>{ const b = e.target.closest('[data-room]'); if(b) joinRoom(b.dataset.room); });
$('#btnLocal').addEventListener('click', ()=>{ setMode('local'); screen = 'room'; myRid = null; loadScore(); });
$('#btnLeave').addEventListener('click', leaveRoom);
const sideKey = () => 'ta3-side-' + (myRid || '');
function pickSide(s){
  if(mode!=='online' || phase!=='lobby' || !myRid) return;
  if(taken[s] || !ACTIVE().includes(s)) return;
  mySide = s; ready = false; note = ''; autoDone = true;
  store.set(sideKey(), s);
  SLOTS.forEach(x=>F[x].local = (x===s));
  F[s].x = F[s].tx = startX(s);
  pushPresence(true);
}
function leaveSide(){
  if(phase!=='lobby') return;
  mySide = null; ready = false; autoDone = true;
  store.set(sideKey(), null);
  SLOTS.forEach(x=>F[x].local = false);
  pushPresence(true);
}
document.getElementById('slots').addEventListener('click', e=>{
  const b = e.target.closest('.pick'); if(!b) return;
  if(mySide===b.dataset.side) leaveSide(); else pickSide(b.dataset.side);
});
$('#btnReady').addEventListener('click', ()=>{
  if(phase!=='lobby') return;
  if(mode==='local'){ roundWins = {L:0, R:0}; startCountdown(); return; }
  if(!mySide) return;
  ready = !ready; if(ready) mySeed = Math.floor(Math.random()*2**31); pushPresence(true);
});

function startCountdown(){
  resetFighters();
  if(mode==='local' || mySide==='L') roundSeed = mySeed + roundNo();
  else roundSeed = (taken.L ? num(taken.L.presence.seed, 1) : 1) + roundNo();
  if(mode==='local') mySeed = Math.floor(Math.random()*2**31);
  lastCount = null;
  phase = 'countdown'; cdStart = performance.now(); note = '';
  const sr = stage.getBoundingClientRect(); if(sr.top < 0 || sr.bottom > innerHeight + 40) stage.scrollIntoView({block:'start', behavior: rm ? 'auto' : 'smooth'});
  pushPresence(true);
}
function backToLobby(msg){
  phase = 'lobby'; ready = false; note = msg || '';
  roundWins = {L:0, R:0};
  count.classList.remove('show'); hideBanner();
  resetFighters(); hideProps();
  pushPresence(true);
}
function roundOver(loseTeam, now){
  if(phase !== 'fight') return;
  const winTeam = loseTeam==='L' ? 'R' : 'L';
  roundWins[winTeam]++;
  lastLose = loseTeam;
  if(roundWins[winTeam] >= need()){ startEnding(loseTeam); return; }
  enterRoundEnd(winTeam, now);
}
function enterRoundEnd(winTeam, now){
  phase = 'roundend'; reT0 = now;
  clearItems();
  const winners = ACTIVE().filter(s=>team(s)===winTeam);
  showBanner(`${esc(t('roundWon',{a:namesOf(winners)}))}<small>${roundWins.L} - ${roundWins.R}</small>`);
  sfx.combo();
  pushPresence(true);
}

/* ---------------- Ending: rocket ---------------- */
const rocketEl = $('#rocket'), robotEl = $('#robot'), ropePath = $('#ropePath');
function hideProps(){
  rocketEl.className = 'prop'; robotEl.className = 'prop';
  robotEl.querySelectorAll('.bubble').forEach(b=>b.remove());
  ropePath.setAttribute('d','');
  SLOTS.forEach(s=>F[s].custom = false);
}
function startEnding(loseTeam){
  if(phase==='ending') return;
  const now = performance.now();
  const losers = ACTIVE().filter(s=>team(s)===loseTeam);
  const winners = ACTIVE().filter(s=>team(s)!==loseTeam);
  const avg = list => list.reduce((a,s)=>a + F[s].dispX, 0) / list.length;
  const dirW = Math.sign(avg(winners) - avg(losers)) || (loseTeam==='L' ? 1 : -1);
  const n = losers.length, m = winners.length;
  let lo, hi;
  if(dirW > 0){ lo = 190 + (n-1)*120; hi = 590 - (m-1)*130; }
  else { lo = 410 + (m-1)*130; hi = 810 - (n-1)*120; }
  const anchor = clamp(avg(losers), lo, hi);
  E = {t0:now, loseTeam, losers, winners, dirW, anchor, rw:{L:roundWins.L, R:roundWins.R},
       lx0: losers.map(s=>F[s].dispX), lx: losers.map((s,i)=>anchor - dirW*i*120),
       wx0: winners.map(s=>F[s].dispX), wx1: winners.map((s,i)=>clamp(anchor + dirW*(340 + i*130), XMIN, XMAX)),
       rx: anchor + dirW*150, robStart: dirW>0 ? -80 : 1080, robX: clamp(anchor - dirW*((n-1)*120 + 150), 40, 960),
       b1:false, b2:false, launched:false, star:false, final:false};
  phase = 'ending'; ready = false; lastLose = loseTeam;
  SLOTS.forEach(s=>{ F[s].atk = null; });
  losers.forEach(s=>F[s].custom = true);
  clearItems();
  showBanner(t('koBig')); sfx.ko();
  shakeStage();
  pushPresence(true);
}
function placeProp(el, cx, bottomY, ratio){
  const w = el.getBoundingClientRect().width || W*0.08;
  el.style.transform = `translate3d(${cx - w/2}px, ${bottomY - w*ratio}px, 0)`;
  return w;
}
function updateEnding(now){
  const tt = now - E.t0, dirW = E.dirW;
  const wk = ease(clamp(tt/600, 0, 1));
  E.winners.forEach((s,i)=>{ const f = F[s]; f.dispX = lerp(E.wx0[i], E.wx1[i], wk); f.y = 0; f.cr = false; if(f.local) f.x = f.dispX; });
  const rxPx = px(E.rx);
  const rw = rocketEl.getBoundingClientRect().width || W*0.075, rh = rw*150/60, noz = rh*124/150;
  let nozzleY = -rh;
  if(tt >= 900){
    rocketEl.classList.add('on');
    if(tt < 1400){ const k = (tt-900)/500; nozzleY = lerp(-rh*0.3, gY, k*k); }
    else nozzleY = gY;
    if(tt >= 3000) rocketEl.classList.add('lit');
    let shake = 0;
    if(tt >= 3000 && tt < 3600 && !rm) shake = (Math.random()-.5)*3;
    if(tt >= 3600){
      const d = (tt-3600)/1000;
      nozzleY = gY - (0.5*2.4*H*d*d + 0.25*H*d);
      if(!E.launched){ E.launched = true; smokeAt(rxPx, gY-8, 8); shakeStage(); sfx.rocket(); }
    }
    rocketEl.style.transform = `translate3d(${rxPx - rw/2 + shake}px, ${nozzleY - noz}px, 0)`;
  }
  if(tt >= 1300){
    robotEl.classList.add('on');
    let rx = E.robStart, walking = false;
    if(tt < 2200){ rx = lerp(E.robStart, E.robX, ease((tt-1300)/900)); walking = true; }
    else if(tt < 3000) rx = E.robX;
    else if(tt < 3400){ rx = lerp(E.robX, E.robX - dirW*60, ease((tt-3000)/400)); walking = true; }
    else rx = E.robX - dirW*60;
    robotEl.classList.toggle('walking', walking);
    robotEl.classList.toggle('wave', tt >= 3600);
    placeProp(robotEl, px(rx), gY, 110/80);
    if(tt >= 2200 && !E.b1){ E.b1 = true; bubble(robotEl, t(E.losers.length > 1 ? 'robot2' : 'robot1'), 'bot', 900); }
    if(tt >= 3050 && !E.b2){ E.b2 = true; bubble(robotEl, t('robot3'), 'bot', 1200); }
  }
  const charH = charW*200/140;
  let rope = '';
  E.losers.forEach((s,i)=>{
    const L = F[s];
    const lxPx = lerp(px(E.lx0[i]), px(E.lx[i]), ease(clamp(tt/500,0,1)));
    let fx = lxPx, fy = gY, ang;
    if(tt < 3600){
      ang = -85*dirW*ease(clamp(tt/350, 0, 1));
      if(tt >= 2450) rope += `M${rxPx} ${nozzleY} Q${(rxPx+fx)/2} ${gY-18-i*10} ${fx} ${gY-6} `;
    } else {
      const d = (tt-3600)/1000, k = ease(clamp(d/0.5, 0, 1));
      const ropeLen = H*0.12 + i*(charH*1.02);
      fx = lerp(lxPx, rxPx - dirW*i*14, k);
      fy = Math.min(gY, nozzleY + ropeLen);
      ang = lerp(-85*dirW, -180*dirW, ease(clamp(d/0.45, 0, 1))) + (10 + i*4)*Math.sin(d*8 + i)*k;
      rope += `M${rxPx} ${nozzleY} L${fx} ${fy} `;
    }
    L.el.style.transform = `translate3d(${fx - charW/2}px, ${fy - gY}px, 0) rotate(${ang}deg)`;
  });
  ropePath.setAttribute('d', rope);
  if(tt >= 4900 && !E.star){ E.star = true; starAt(rxPx); }
  if(tt >= 1300 && tt < 4900) hideBanner();
  if(tt >= 5000 && !E.final){
    E.final = true;
    const winTeam = E.loseTeam==='L' ? 'R' : 'L';
    score[winTeam]++; store.set(scoreKey(), score);
    const rs = rounds===3 ? ` (${E.rw.L}-${E.rw.R})` : '';
    showBanner(`${esc(t('sent',{a:namesOf(E.losers)}))}<small>${esc(t('winner',{b:namesOf(E.winners)}) + rs)}</small>`);
  }
  if(tt >= 8200){ E = null; backToLobby(''); }
}

/* ---------------- Items (Gökten hediye) ---------------- */
const ITEM_SVG = {
  flower:`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 22 V38" stroke="#3F7A4A" stroke-width="3"/><path d="M20 32 C14 28 12 30 12 30 C14 34 18 34 20 32Z" fill="#5FA05A" stroke="#2B1B2E" stroke-width="1.5"/>${[0,72,144,216,288].map(a=>`<circle cx="${20+6*Math.cos(a*Math.PI/180)}" cy="${14+6*Math.sin(a*Math.PI/180)}" r="5.5" fill="#FF7EB3" stroke="#2B1B2E" stroke-width="1.5"/>`).join('')}<circle cx="20" cy="14" r="4" fill="#FFD24A" stroke="#2B1B2E" stroke-width="1.5"/></svg>`,
  tea:`<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="36" rx="15" ry="3.5" fill="#F4F4F6" stroke="#2B1B2E" stroke-width="2"/><path d="M12 7 H28 C28 14 23.5 18 23.5 22 C23.5 27 28 30 28 34 H12 C12 30 16.5 27 16.5 22 C16.5 18 12 14 12 7Z" fill="rgba(255,255,255,.65)" stroke="#2B1B2E" stroke-width="2"/><path d="M13.5 11 H26.5 C26 15 22 18 22 22 C22 27 26.5 30 26.5 33 H13.5 C13.5 30 18 27 18 22 C18 18 14 15 13.5 11Z" fill="#C0392B"/><path d="M15 12 C16 16 18 18 18 21" stroke="#fff" stroke-width="1.5" fill="none" opacity=".6"/></svg>`,
  slipper:`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 29 C5 21 13 17 22 17 C32 17 36 23 36 27 C36 32 30 34 22 33.5 C14 33.5 5 33.5 5 29Z" fill="#6B8FC7" stroke="#2B1B2E" stroke-width="2"/><path d="M13 25 C17 15 28 15 32 24" fill="none" stroke="#2E4E8A" stroke-width="4.5" stroke-linecap="round"/></svg>`
};
let items = [], itemRng = null, nextItemAt = 0, itemSeq = 0;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
function clearItems(){ items.forEach(it=>it.el && it.el.remove()); items = []; itemRng = null; }
function startItems(){ clearItems(); itemRng = mulberry32(roundSeed || 1); itemSeq = 0; nextItemAt = 3000 + itemRng()*2000; }
function killItem(it){ if(it.gone) return; it.gone = true; it.el.classList.add('gone'); setTimeout(()=>it.el.remove(), 320); }
function updateItems(now){
  if(!MODES[gameMode].items || !itemRng) return;
  const el = now - fightT0;
  while(el >= nextItemAt){
    const r = itemRng(), type = r < .4 ? 'flower' : r < .7 ? 'tea' : 'slipper';
    const x = 120 + itemRng()*760;
    const d = document.createElement('div');
    d.className = 'fx item'; d.innerHTML = ITEM_SVG[type];
    stage.appendChild(d);
    items.push({id: (roundSeed % 100000)*100 + (itemSeq++), type, x, spawn: nextItemAt, land: nextItemAt + 1100, landed:false, gone:false, el:d});
    nextItemAt += (effFmt()==='2v2' ? 2800 : 3500) + itemRng()*2500;
  }
  const act = ACTIVE();
  const oppGot = [];
  for(const s of act) if(!F[s].local) oppGot.push(...F[s].got);
  for(const it of items){
    if(it.gone) continue;
    const w = it.el.getBoundingClientRect().width || W*0.055;
    const k = clamp((el - it.spawn)/(it.land - it.spawn), 0, 1);
    const yTop = lerp(-w*1.2, gY - w, k*k);
    it.el.style.transform = `translate3d(${px(it.x) - w/2}px, ${yTop}px, 0) rotate(${it.type==='slipper' && k<1 ? el*0.6 : 0}deg)`;
    if(oppGot.includes(it.id)){ killItem(it); continue; }
    if(k >= 1 && !it.landed){
      it.landed = true;
      if(it.type==='slipper'){
        sfx.slipper(); smokeAt(px(it.x), gY-6, 4);
        for(const s of act){
          const f = F[s];
          if(f.local && alive(f) && Math.abs(f.x - it.x) < 60 && f.y < 50){
            f.hp = Math.max(0, f.hp - 10); f.hs++; f.ht = 'insult'; f.ch = 0;
            f.flashUntil = now + 150; f.stunUntil = now + 300;
            textFx(f.el, 'dmg', '-10'); textFx(f.el, 'pow', t('slipper'));
            pushPresence(true);
          }
        }
        setTimeout(()=>killItem(it), 1200);
      }
    }
    if(it.landed && it.type!=='slipper'){
      for(const s of act){
        const f = F[s];
        if(!f.local || !alive(f) || it.gone) continue;
        if(Math.abs(f.x - it.x) < 65 && f.y < 60){
          if(it.type==='flower'){ f.hp = Math.min(maxHp(), f.hp + 15); textFx(f.el, 'pow good', t('heal')); }
          else { f.en = 100; textFx(f.el, 'pow good', t('tea')); }
          f.got = f.got.concat(it.id).slice(-20);
          sfx.pick(); killItem(it); pushPresence(true);
        }
      }
      if(el > it.land + 5000) killItem(it);
    }
  }
}

/* ---------------- Room / presence ---------------- */
let lastSent = 0, lastPayload = '';
function pushPresence(force){
  if(!room || mode!=='online') return;
  const now = performance.now();
  if(!force && now - lastSent < 55) return;
  const f = mySide ? F[mySide] : null;
  const inRoom = screen==='room' && !!myRid;
  const p = inRoom ? {
    app:'ta3', rid: myRid, side: mySide, ready, phase, scene, sceneTs, me: Object.assign({}, myProfile, {name: myProfile.name || (acctMe ? acctMe.nick : '')}), pc: f ? f.pc : 0, pt: f ? f.pt : null,
    mode: gameMode, modeTs, fmt, fmtTs, rounds, roundsTs, seed: mySeed, rw: roundWins, lt: lastLose,
    cbs: f ? f.cbs : 0, cb: f ? f.cb : -1, cba: f ? f.cba : null, ch: f ? f.ch : 0, got: f ? f.got : [],
    x: f ? Math.round(f.x) : 0, y: f ? Math.round(f.y) : 0, cr: f ? f.cr : false, mv: f ? f.mv : 0, fd: f ? f.fd : 1,
    atk: f && f.lastAtk ? {id: f.lastAtk.id, type: f.lastAtk.type, li: f.lastAtk.li} : null,
    hp: f ? Math.round(f.hp) : maxHp(), en: f ? Math.round(f.en) : 100, hs: f ? f.hs : 0, ht: f ? f.ht : null
  } : {app:'ta3', rid: null};
  const s = JSON.stringify(p);
  if(s === lastPayload && !force) return;
  lastPayload = s; lastSent = now;
  room.presence(Object.assign(inRoom ? {} : {side:null, ready:null, phase:null, me:null, atk:null, got:null}, p)).catch(()=>{});
}
const num = (v, d) => (typeof v==='number' && isFinite(v)) ? v : d;
function applyRemote(f, pr, now){
  f.rphase = typeof pr.phase==='string' ? pr.phase : 'lobby';
  if(f.custom) return;
  f.tx = clamp(num(pr.x, startX(f.slot)), XMIN, XMAX);
  if(phase==='lobby') f.tx = startX(f.slot);
  f.y = clamp(num(pr.y, 0), 0, 400);
  f.cr = !!pr.cr; f.mv = clamp(num(pr.mv,0), -1, 1);
  if(pr.fd===1 || pr.fd===-1) f.fd = pr.fd;
  const prevHp = f.hp;
  f.hp = clamp(num(pr.hp, maxHp()), 0, maxHp());
  f.en = clamp(num(pr.en, 100), 0, 100);
  f.got = Array.isArray(pr.got) ? pr.got.filter(v=>typeof v==='number').slice(-20) : [];
  const a = pr.atk;
  if(!a && f.remoteAtkId === undefined) f.remoteAtkId = null;
  if(a && typeof a.id==='number'){
    if(f.remoteAtkId === undefined) f.remoteAtkId = a.id;
    else if(a.id !== f.remoteAtkId){
      f.remoteAtkId = a.id;
      if(SPEC[a.type] && phase==='fight' && alive(f)){ f.atk = {id:a.id, type:a.type, start:now, li: num(a.li,0)}; if(a.type==='love') textFx(f.el, 'pow good', '+' + SPEC.love.heal); onAttackStart(f); }
    }
  }
  const hs = num(pr.hs, 0);
  if(hs > f.hs){ if(phase==='fight' && SPEC[pr.ht]) hitVisual(f, pr.ht, now, Math.max(1, Math.round(prevHp - f.hp)), num(pr.ch,0)); }
  f.hs = hs;
  const pc = num(pr.pc, 0);
  if(f.pcSeen === undefined) f.pcSeen = pc;
  else if(pc > f.pcSeen){
    f.pcSeen = pc;
    if(phase==='fight'){
      blockFx(f);
      const A = SLOTS.includes(pr.pt) ? F[pr.pt] : null;
      if(A){ if(A.local) parried(A, now); else { A.loveUntil = now + 650; textFx(A.el, 'pow', t('powLove')); } }
    }
  } else f.pcSeen = pc;
  const cbs = num(pr.cbs, 0);
  if(f.cbsSeen === undefined) f.cbsSeen = cbs;
  else if(cbs > f.cbsSeen){ f.cbsSeen = cbs; if(phase==='fight') showCombo(num(pr.cb,-1), SLOTS.includes(pr.cba) ? pr.cba : null); }
  else f.cbsSeen = cbs;
}
const IN_GAME = ['countdown','fight','roundend','ending'];
function computeRooms(all){
  const info = {};
  for(const id of ROOMS){
    const ps = all.filter(p=>p.presence.rid===id);
    let fm = '1v1', ft = -1;
    ps.forEach(p=>{ const v = num(p.presence.fmtTs, 0); if(v > ft && (p.presence.fmt==='1v1' || p.presence.fmt==='2v2')){ ft = v; fm = p.presence.fmt; } });
    if(myRid===id) fm = fmt;
    const cap = fm==='2v2' ? 4 : 2;
    const act = fm==='2v2' ? SLOTS : ['L','R'];
    let seated = ps.filter(p=>act.includes(p.presence.side)).length;
    let count = ps.length, inGame = ps.some(p=>IN_GAME.includes(p.presence.phase));
    if(myRid===id){ count++; if(mySide && act.includes(mySide)) seated++; if(IN_GAME.includes(phase)) inGame = true; }
    info[id] = {count, seated, cap, inGame};
  }
  return info;
}
function processRoom(now){
  const ps = room.peers();
  const me = ps.find(p=>p.sameTab); myPeer = me ? me.peer : null;
  const all = ps.filter(p=>!p.sameTab && p.presence && p.presence.app==='ta3');
  onlineCount = all.length + 1;
  roomInfo = computeRooms(all);
  if(screen!=='room' || !myRid){ taken = {}; return; }
  const others = all.filter(p=>p.presence.rid===myRid);
  const lp = others.find(p=>p.presence.side==='L');
  for(const p of others){
    const pr = p.presence;
    const st = num(pr.sceneTs, 0);
    if(st > sceneTs && (pr.scene==='adana' || pr.scene==='hatay')) setScene(pr.scene, st);
    if(phase==='lobby'){
      const tie = (ts, mine, theirs, mineV) => ts===mine && p===lp && mySide!=='L' && theirs!==mineV;
      const mt = num(pr.modeTs, 0);
      if((mt > modeTs || tie(mt, modeTs, pr.mode, gameMode)) && MODES[pr.mode]) setGameMode(pr.mode, mt);
      const ft = num(pr.fmtTs, 0);
      if((ft > fmtTs || tie(ft, fmtTs, pr.fmt, fmt)) && (pr.fmt==='1v1' || pr.fmt==='2v2')) setFmt(pr.fmt, ft);
      const rt = num(pr.roundsTs, 0);
      if((rt > roundsTs || tie(rt, roundsTs, pr.rounds, rounds)) && (pr.rounds===1 || pr.rounds===3)) setRounds(pr.rounds, rt);
    } else if(pr.rw && IN_GAME.includes(pr.phase) && phase!=='ending'){
      const L = num(pr.rw.L, 0), R = num(pr.rw.R, 0);
      const behind = L + R > roundWins.L + roundWins.R && L < 3 && R < 3;
      if(pr.phase==='ending' && (phase==='fight' || phase==='roundend') && (pr.lt==='L' || pr.lt==='R')){ if(behind) roundWins = {L, R}; startEnding(pr.lt); }
      else if(behind){
        const winTeam = L > roundWins.L ? 'L' : 'R';
        roundWins = {L, R};
        if(phase==='fight' && (pr.phase==='roundend' || pr.phase==='countdown')) enterRoundEnd(winTeam, now - 1200);
      }
    }
  }
  if(mySide && phase==='lobby'){
    const clash = others.find(p=>p.presence.side===mySide);
    if(clash && myPeer && clash.peer < myPeer){ mySide = null; ready = false; SLOTS.forEach(s=>F[s].local = false); note = t('takenNote'); pushPresence(true); }
  }
  taken = {};
  SLOTS.forEach(s=>{ taken[s] = others.find(p=>p.presence.side===s) || null; });
  roomCount = others.length + 1;
  if(!mySide && !autoDone && phase==='lobby' && connState==='on' && connectedAt && now - connectedAt > 1500){
    autoDone = true;
    const pref = store.get(sideKey(), null);
    if(SLOTS.includes(pref) && ACTIVE().includes(pref) && !taken[pref]) pickSide(pref);
  }
  for(const s of SLOTS){
    if(s===mySide) continue;
    const p = taken[s];
    remoteProfiles[s] = p ? sanitizeProfile(p.presence.me) : null;
    F[s].ghost = !p;
    if(p) applyRemote(F[s], p.presence, now);
    else if(!F[s].custom){ F[s].tx = startX(s); F[s].hp = maxHp(); F[s].en = 100; F[s].y = 0; F[s].cr = false; F[s].mv = 0; F[s].rphase = 'lobby'; }
  }
  if(mySide) F[mySide].ghost = false;
  const act = ACTIVE(), rest = act.filter(s=>s!==mySide);
  const okFor = s => { const p = taken[s]; return p && p.presence.ready && p.presence.mode===gameMode && p.presence.fmt===fmt && p.presence.rounds===rounds && ['lobby','countdown','fight'].includes(p.presence.phase); };
  if(phase==='lobby' && mySide && act.includes(mySide) && ready && rest.every(okFor)) startCountdown();
  if(phase==='countdown' && !rest.every(s=>taken[s] && taken[s].presence.ready)) backToLobby(t('notReady'));
  if(phase==='fight' || phase==='roundend'){
    const bad = rest.some(s=>!taken[s] || (taken[s].presence.phase==='lobby' && !taken[s].presence.ready));
    if(bad){
      if(!missingSince) missingSince = now;
      else if(now - missingSince > 2500){ missingSince = 0; backToLobby(t('someoneLeft')); }
    } else missingSince = 0;
  }
}

function renderFighter(f, now){
  const act = ACTIVE().includes(f.slot);
  if(!act){ if(f.cls !== 'fighter off'){ f.el.className = 'fighter off'; f.cls = 'fighter off'; } return; }
  const attacking = f.atk && now - f.atk.start < SPEC[f.atk.type].dur;
  if(!f.local && f.atk && !attacking) f.atk = null;
  if(!f.local && !f.custom && phase!=='ending'){ f.dispX = lerp(f.dispX, f.tx, 1 - Math.exp(-dt*18)); }
  if(phase!=='fight' && !f.custom){
    const ne = nearestEnemy(f);
    if(ne) f.fd = Math.sign(ne.dispX - f.dispX) || f.fd;
  }
  const ending = phase==='ending';
  const ko = (phase==='fight' || phase==='roundend') && !alive(f);
  const cls = ['fighter'];
  if(f.fd < 0) cls.push('face-left');
  if(!ending && !ko){
    if(f.cr && f.y < 5) cls.push('crouch');
    if(f.y > 3) cls.push('air');
    else if(f.mv) cls.push('walk');
    if(attacking) cls.push(f.atk.type==='trip' ? 'slap' : f.atk.type==='insult' ? 'kick' : 'love');
    if(f.flashUntil > now) cls.push('hitflash');
    if(f.shieldUntil > now) cls.push('shielded');
    if(f.en < 25 && phase==='fight') cls.push('tired');
    if(phase==='fight' && isRage(f)){
      cls.push('rage');
      if(!f.rageShown){ f.rageShown = true; textFx(f.el, 'pow rage', t('rage')); sfx.rage(); }
    }
  }
  if(ko){
    cls.push('ko');
    if(!f.koShown){ f.koShown = true; textFx(f.el, 'pow', t('ko')); if(phase==='fight') sfx.ko(); }
  }
  if(f.custom) cls.push('custom');
  if(f.ghost && mode==='online' && screen==='room') cls.push('ghost');
  const c = cls.join(' ');
  if(c !== f.cls){ f.el.className = c; f.cls = c; }
  let face = 'normal';
  if(ending){ face = E && E.losers.includes(f.slot) ? 'hurt' : (E && now - E.t0 > 3600 ? 'love' : 'normal'); }
  else if(ko) face = 'hurt';
  else if(phase==='roundend') face = 'love';
  else if(f.loveUntil > now) face = 'love';
  else if(f.flashUntil > now || f.stunUntil > now) face = 'hurt';
  else if(attacking) face = f.atk.type==='love' ? 'love' : 'angry';
  else if(f.en < 25 && phase==='fight') face = 'tired';
  if(face !== f.face){ f.el.dataset.face = face; f.face = face; }
  if(!f.custom){
    if(ko) f.el.style.transform = `translate3d(${px(f.dispX) - charW/2}px, 0, 0) rotate(${-85*f.fd}deg)`;
    else f.el.style.transform = `translate3d(${px(f.dispX) - charW/2}px, ${-px(f.y)}px, 0)`;
  }
}

    if(key === h.last) continue; h.last = key;
    h.fill.style.width = pct + '%'; h.trail.style.width = tp + '%';
    h.root.dataset.level = lvl; h.num.textContent = Math.round(f.hp);
    h.root.classList.toggle('ko', f.hp <= 0 && phase!=='lobby');
    h.enFill.style.width = f.en + '%';
    h.en.classList.toggle('tired', f.en < 25);
    if(f.lowUntil > now && !h.en.classList.contains('flash')){ h.en.classList.add('flash'); setTimeout(()=>h.en.classList.remove('flash'), 460); }
  }
  const sc = `${score.L} : ${score.R}`;
  if($('#score').textContent !== sc) $('#score').textContent = sc;
  const pk = `${rounds}|${roundWins.L}|${roundWins.R}|${phase}`;
  if(pk !== lastPips){
    lastPips = pk;
    const pip = (on) => `<i class="pip${on ? ' on' : ''}"></i>`;
    $('#pips').hidden = rounds !== 3;
    $('#pips').innerHTML = `<span>${pip(roundWins.L>=1)}${pip(roundWins.L>=2)}</span><span>${pip(roundWins.R>=2)}${pip(roundWins.R>=1)}</span>`;
  }
}
let lastUi = '', lastMenu = '';
function renderMenu(){
  const key = [lang, connState, onlineCount, JSON.stringify(roomInfo), store.get('ta3-room',''), !!installEvt].join('|');
  if(key === lastMenu) return; lastMenu = key;
  const off = connState==='off';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  $('#btnInstall').hidden = !ACCOUNTS || standalone() || !(installEvt || ios);
  $('#menuConn').innerHTML = off ? t('offMsg') : connState==='connecting' ? t('connecting') : connState==='wait' ? t('reconnecting') : t('onlineCount',{n:onlineCount});
  const lastRoom = store.get('ta3-room', '');
  ROOMS.forEach(id=>{
    const li = document.getElementById('room-'+id), info = roomInfo[id] || {count:0, seated:0, cap:2, inGame:false};
    li.querySelector('.room-name').textContent = t('room_'+id) + (id===lastRoom ? ` · ${t('lastRoom')}` : '');
    const st = info.inGame ? t('roomPlaying') : info.count===0 ? t('roomEmpty') : info.seated >= info.cap ? t('roomFull') : t('roomWaiting',{a:info.seated, b:info.cap});
    li.querySelector('.room-state').textContent = st;
    li.classList.toggle('busy', info.inGame || info.seated >= info.cap);
    li.classList.toggle('waiting', !info.inGame && info.count > 0 && info.seated < info.cap);
    const b = li.querySelector('.join'); b.textContent = t('join');
    b.disabled = off || !room || connState==='connecting' || info.inGame || info.seated >= info.cap;
  });
}
function renderAuth(){
  const key = [lang, authTab, authState, SIGNUP_CODE].join('|');
  if(key === lastAuthUi) return; lastAuthUi = key;
  document.querySelectorAll('#authTabs button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.t===authTab)));
  $('#auPass2Wrap').hidden = authTab!=='up';
  $('#auCodeWrap').hidden = !(authTab==='up' && SIGNUP_CODE);
  $('#auPass').setAttribute('autocomplete', authTab==='up' ? 'new-password' : 'current-password');
  $('#auSubmit').textContent = t(authTab==='up' ? 'authUp' : 'authIn');
  const nocfg = authState==='nocfg';
  $('#authForm').hidden = nocfg; $('#authTabs').hidden = nocfg;
  $('#auHelp').textContent = nocfg ? t('nocfg') : authState==='checking' ? t('connecting') : t('authHelp');
  $('#auGuest').hidden = !nocfg;
}
let lastAuthUi = '';
function renderUi(){
  const gate = gated();
  $('#auth').hidden = !gate;
  if(gate){ $('#menu').hidden = true; $('#lobby').hidden = true; $('#padWrap').hidden = true; renderAuth(); return; }
  $('#menu').hidden = screen!=='menu';
  if(screen==='menu'){ renderMenu(); $('#lobby').hidden = true; $('#padWrap').hidden = true; return; }
  const lobbyOn = phase==='lobby';
  const padOn = (phase==='countdown' || phase==='fight' || phase==='roundend') && (mode==='local' || !!mySide);
  const cs = controlSide();
  const f = cs ? F[cs] : null;
  const act = ACTIVE(), duo = effFmt()==='2v2';
  const dims = f ? ['trip','insult','love'].map(x=>f.en < SPEC[x].cost ? 1 : 0).join('') + (performance.now() < f.loveCd ? 'c' : '') : '';
  const tk = SLOTS.map(s=>taken[s] ? (taken[s].presence.ready ? 2 : 1) : 0).join('');
  const key = [lang, roomCount, gameMode, fmt, rounds, mode, phase, mySide, ready, connState, tk, note, SLOTS.map(nameOf).join(','), dims, padOn, f && alive(f), myRid].join('|');
  if(key === lastUi) return; lastUi = key;
  $('#lobby').hidden = !lobbyOn;
  $('#padWrap').hidden = !padOn;
  $('#roomTitle').textContent = mode==='local' ? t('localRoom') : t('room_'+myRid);
  $('#btnLeave').textContent = mode==='local' ? t('backMenu') : t('leaveRoom');
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===gameMode)));
  document.querySelectorAll('#fmts button').forEach(b=>{ b.setAttribute('aria-pressed', String(b.dataset.fmt===effFmt())); b.disabled = mode==='local'; });
  document.querySelectorAll('#roundsSel button').forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.r===rounds)));
  $('#modeDesc').textContent = t(MODES[gameMode].desc) + (rounds===3 ? t('desc3r') : '') + (duo ? t('desc2v2') : '');
  $('#teamHL').hidden = !duo; $('#teamHR').hidden = !duo;
  const btnReady = $('#btnReady');
  if(mode==='local'){
    $('#conn').innerHTML = t('localConn');
    SLOTS.forEach(s=>{
      const slot = document.getElementById('slot'+s);
      slot.hidden = !act.includes(s);
      slot.classList.remove('mine');
      const st = slot.querySelector('.slot-state');
      st.textContent = s==='L' ? t('localL') : t('localR');
      st.classList.remove('ok');
      slot.querySelector('.pick').hidden = true;
    });
    btnReady.textContent = t('btnStart'); btnReady.classList.remove('on'); btnReady.disabled = false;
    $('#lobbyHint').textContent = t('hintLocal');
    $('#keys').textContent = t('keysLocal');
  } else {
    const seated = act.filter(s=>s===mySide || taken[s]).length;
    let c = connState==='connecting' ? t('connecting') : connState==='wait' ? t('reconnecting') : connState==='off' ? t('offMsg') : !mySide ? t('stPick') : seated < act.length ? t('stWaiting',{a:seated, b:act.length}) : t('stAll');
    if(connState==='on') c += t('roomPeople',{n:roomCount});
    if(note) c += ' ' + esc(note);
    $('#conn').innerHTML = c;
    SLOTS.forEach(s=>{
      const slot = document.getElementById('slot'+s), st = slot.querySelector('.slot-state'), pk = slot.querySelector('.pick');
      slot.hidden = !act.includes(s);
      const mine = mySide===s, tk2 = taken[s];
      slot.classList.toggle('mine', mine);
      if(mine){ st.textContent = ready ? t('youReady') : t('you'); st.classList.toggle('ok', ready); pk.hidden = false; pk.textContent = t('leaveSide'); }
      else if(tk2){ st.textContent = tk2.presence.ready ? t('ready') : t('preparing'); st.classList.toggle('ok', !!tk2.presence.ready); pk.hidden = true; }
      else { st.textContent = t('empty'); st.classList.remove('ok'); pk.hidden = !!mySide || connState!=='on'; pk.textContent = t('pickSide'); }
    });
    btnReady.disabled = !mySide;
    btnReady.textContent = ready ? t('btnCancel') : t('btnReady');
    btnReady.classList.toggle('on', ready);
    $('#lobbyHint').textContent = t('hintOnline');
    $('#keys').textContent = t('keysOnline') + (f && !alive(f) ? t('koWatch') : '');
  }
  const loveBtn = document.querySelector('.atk [data-a="love"]');
  loveBtn.hidden = !cs;
  if(cs) loveBtn.innerHTML = `${esc(ultText(cs))}<small>${t('ultSub')}</small>`;
  document.querySelector('.atk [data-a="trip"]').innerHTML = `${t('trip')}<small>${t('tripSub')}</small>`;
  document.querySelector('.atk [data-a="insult"]').innerHTML = `${t('insult')}<small>${t('insultSub')}</small>`;
  if(f){ document.querySelectorAll('.atk .btn').forEach(b=>b.classList.toggle('dim', f.en < SPEC[b.dataset.a].cost || !alive(f) || (b.dataset.a==='love' && performance.now() < f.loveCd))); }
}

/* ---------------- Loop ---------------- */
let last = performance.now(), dt = 0, lastCount = null;
function frame(now){
  dt = Math.min(0.05, (now - last)/1000); last = now;
  computeHeld();
  if(room && mode==='online') processRoom(now);
  const act = ACTIVE();
  if(phase==='countdown'){
    const e = now - cdStart, off = rounds===3 ? 900 : 0;
    let label, n;
    if(e < off){ label = t('round',{n:roundNo()}); n = 'r'; }
    else { n = 3 - Math.floor((e-off)/700); label = n > 0 ? String(n) : t('go'); }
    count.textContent = label;
    count.classList.add('show');
    if(n !== lastCount){ lastCount = n; if(n!=='r') sfx.beep(n <= 0); }
    if(e > off + 2800){ phase = 'fight'; fightT0 = now; startItems(); pushPresence(true); }
  } else if(phase==='fight'){
    const e = now - cdStart;
    if(e > (rounds===3 ? 900 : 0) + 3400) count.classList.remove('show');
    const frozen = now < freezeUntil;
    stage.classList.toggle('stop', frozen);
    if(!frozen) for(const s of act){ if(phase==='fight' && F[s].local) updateLocal(F[s], inputs[s], dt, now); }
    for(const vs of act){
      const B = F[vs];
      if(!B.local) continue;
      for(const A of enemiesOf(B)) if(phase==='fight') tryHit(A, B, now);
    }
    if(phase==='fight') updateItems(now);
    checkWipe(now);
  } else if(phase==='roundend'){
    count.classList.remove('show');
    for(const s of act){ const f = F[s]; if(f.local){ f.mv = 0; f.cr = false; f.atk = null; if(f.vy !== 0 || f.y > 0){ f.vy -= GRAV*dt; f.y = Math.max(0, f.y + f.vy*dt); if(f.y===0) f.vy = 0; } f.dispX = f.x; } }
    if(now - reT0 > 2800){ hideBanner(); startCountdown(); }
  } else count.classList.remove('show');
  if(phase==='ending' && E) updateEnding(now);
  if(phase!=='fight') stage.classList.remove('stop');
  SLOTS.forEach(s=>{ inputs[s].press = {}; });
  refreshLooks();
  SLOTS.forEach(s=>renderFighter(F[s], now));
  renderHud(now);
  renderUi();
  if(ACCOUNTS){ renderAccount(); pushStatus(false); }
  pushPresence(false);
  requestAnimationFrame(frame);
}
applyStatic(); renderSettings();
if(!(window.claude && typeof window.claude.use === 'function')){ connState = 'off'; }
requestAnimationFrame(frame);
})();

</script>
